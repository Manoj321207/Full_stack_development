<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media tags</title>
</head>
<body>
    <h1>Adding audio</h1>
    <audio src="audio1.mp3" controls>Ordinary Person</audio>
    <h1>Adding video</h1>
    <video src="khokho1.mp4" width="200" height="300" controls >Kho kho 2nd innnigs</video>

    <h1>SVG images</h1>
    <img src="img.svg" alt="svg image">

    <h1>adding video using iFrame</h1>
    <iframe width="200" height="300" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=BDu6hYzNRQ9I496G&amp;start=750" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe src="https://www.codewithharry.com/tutorial/working-with-svg/" frameborder="0" allowfullscreen></iframe><br><br>
</body>
</html>
